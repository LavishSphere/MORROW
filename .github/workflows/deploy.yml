name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and publish
        required: true
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          persist-credentials: false
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Set Vite base for this Pages site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          path="${PAGES_BASE_PATH:-/}"
          if [ "$path" = "/" ] || [ -z "$path" ]; then
            echo "VITE_BASE=/" >> "${GITHUB_ENV}"
          else
            echo "VITE_BASE=${path%/}/" >> "${GITHUB_ENV}"
          fi
      - name: Set VITE_API_BASE for Pages → hosted API
        env:
          API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          if [[ -n "${API_BASE}" ]]; then
            trimmed="${API_BASE%/}"
            echo "VITE_API_BASE=${trimmed}" >> "${GITHUB_ENV}"
            printf 'Pages build will call API at %s\n' "${trimmed}" >> "${GITHUB_STEP_SUMMARY}"
          else
            printf '%s\n' "VITE_API_BASE unset — Pages Propose uses bundled/unavailable until the repository Actions variable VITE_API_BASE points at the hosted API (see docs/deploy-api-vultr.md)." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Lint, typecheck, test, build, and audit
        run: npm run ci
      - name: Require the demo entrypoint
        run: |
          test -f dist/index.html
          python3 - <<'PY'
          import os
          from pathlib import Path

          html = Path("dist/index.html").read_text(encoding="utf-8")
          base = os.environ["VITE_BASE"]
          if not html.strip():
              raise SystemExit("dist/index.html is empty")
          if f'src="{base}assets/' not in html:
              raise SystemExit(
                  f"dist/index.html does not load JS under VITE_BASE={base!r}"
              )
          print(f"Pages artifact uses base {base}")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Record the demo URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'Demo URL: %s\n' "${PAGE_URL}" >> "${GITHUB_STEP_SUMMARY}"
