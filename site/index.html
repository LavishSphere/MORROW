<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MORROW static demo host. Make tomorrow possible."
    />
    <meta name="theme-color" content="#e7fcff" />
    <link rel="icon" type="image/png" href="morrow-logo-blue.png" />
    <title>MORROW</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e7fcff;
        color: #173f48;
        text-align: center;
        font-family: "Iowan Old Style", Palatino, Georgia, serif;
      }

      main {
        max-width: 38rem;
        margin: 0 auto;
        padding: 4.5rem 1.25rem 5rem;
      }

      p,
      a {
        font-family: system-ui, sans-serif;
        font-size: 1.05rem;
        line-height: 1.5;
      }

      .mark {
        display: block;
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 0 0.85rem;
      }

      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
        font-weight: 650;
        letter-spacing: 0.14em;
        color: #173f48;
      }

      .tagline {
        margin: 0 0 1.5rem;
        font-size: 1.35rem;
        color: #173f48;
      }

      a {
        color: #173f48;
      }

      a:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="morrow-logo-blue.png" alt="" />
      <h1>MORROW</h1>
      <p class="tagline">Make tomorrow possible.</p>
      <p>
        This URL is the static demo host. The Wellesley showcase is published
        here when the web build is ready.
      </p>
      <p>
        <a href="https://github.com/LavishSphere/MORROW">Project on GitHub</a>
      </p>
    </main>
  </body>
</html>
